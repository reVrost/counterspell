name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build binary for macOS Apple Silicon
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o cspell-macos-arm64 ./cmd/app

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cspell-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Wait for release to be available
          sleep 10
          # Download tar.gz to get SHA256
          curl -L "https://github.com/revrost/counterspell/archive/refs/tags/v${VERSION}.tar.gz" -o /tmp/cspell.tar.gz
          SHA256=$(shasum -a 256 /tmp/cspell.tar.gz | awk '{print $1}')
          # Clone and update homebrew-tap
          git clone https://github.com/counterspell-io/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i.bak "s|url \".*\"|url \"https://github.com/revrost/counterspell/archive/refs/tags/v${VERSION}.tar.gz\"|" Formula/cspell.rb
          sed -i.bak "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/cspell.rb
          rm Formula/cspell.rb.bak
          git add Formula/cspell.rb
          git commit -m "Update cspell to v${VERSION}"
          git push https://${{ secrets.HOMEBREW_TOKEN }}@github.com/counterspell-io/homebrew-tap.git
