name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build binary for macOS Apple Silicon
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o counterspell-macos-arm64 ./cmd/app

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            counterspell-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
